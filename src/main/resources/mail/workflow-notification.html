<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>Thông báo đồ án tốt nghiệp</title></head>
<body style="margin:0;background:#f4f6fa;font-family:Arial,sans-serif;color:#172b4d">
  <div style="max-width:640px;margin:32px auto;background:#fff;border:1px solid #dfe5ee;border-radius:10px;overflow:hidden">
    <div style="background:#164e8a;color:#fff;padding:22px 28px;font-size:20px;font-weight:bold">Hệ thống Đồ án tốt nghiệp</div>
    <div style="padding:28px;line-height:1.6">
      <h1 style="font-size:20px;margin:0 0 16px">{{title}}</h1>
      <p style="white-space:pre-line;margin:0 0 20px">{{message}}</p>
      <p style="margin:0;color:#52657b">Đợt: <strong>{{roundName}}</strong></p>
      <p style="margin:8px 0 0;color:#52657b">Bước: <strong>{{stepName}}</strong></p>
      <p style="margin:8px 0 0;color:#52657b">Thời hạn: <strong>{{deadline}}</strong></p>
    </div>
    <div style="padding:16px 28px;background:#f4f6fa;color:#52657b;font-size:13px">Vui lòng đăng nhập hệ thống để xem hồ sơ và công việc liên quan.</div>
  </div>
</body>
</html>
