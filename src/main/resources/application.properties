spring.application.name=graduation-process-be
server.port=8080

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/graduation_process}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

flowable.database-schema-update=true
flowable.async-executor-activate=false
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${APP_MAIL_FROM:}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:25}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:false}

jwt.secret=${JWT_SECRET:fR19acH6m5Re7rD0p3xfA2IdKV8dnA8dolTH9VRRlv7}
jwt.expiration=86400000
spring.config.import=optional:file:.local.properties
app.bootstrap.password=${APP_BOOTSTRAP_PASSWORD:}
app.seed-demo=${APP_SEED_DEMO:false}
app.seed-auth-demo=${APP_SEED_AUTH_DEMO:true}
