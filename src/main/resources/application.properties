spring.application.name=graduation-process-be
server.port=8080

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/graduation_process}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

flowable.database-schema-update=true
flowable.async-executor-activate=false

jwt.secret=${JWT_SECRET:fR19acH6m5Re7rD0p3xfA2IdKV8dnA8dolTH9VRRlv7}
jwt.expiration=86400000
spring.config.import=optional:file:.local.properties
app.bootstrap.password=${APP_BOOTSTRAP_PASSWORD:}
app.seed-demo=${APP_SEED_DEMO:false}
